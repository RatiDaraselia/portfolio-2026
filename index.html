<meta name="theme-color" content="#000000" />

<!-- Theme resolution. Blocking, inline, and BEFORE <style> so the attribute is on
     <html> before first paint. Must not be a .jsx file: Babel fetches those over
     XHR long after the first frame, which is exactly the flash we're avoiding. -->
<script>
(function(){
  var KEY='bd-theme', root=document.documentElement, tid=null;

  function stored(){
    try{ var v=localStorage.getItem(KEY); return (v==='light'||v==='dark')?v:null; }catch(e){ return null; }
  }
  function resolve(){
    var v=stored(); if(v) return v;
    try{ if(window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) return 'light'; }catch(e){}
    return 'dark';
  }
  function apply(t, animate){
    root.setAttribute('data-theme', t);
    // Set color-scheme imperatively as well as in CSS. The browser paints its
    // default canvas from the OS preference until it knows the document's
    // scheme, which shows as a one-frame white flash for an OS-light user who
    // has chosen dark. Setting it here — before <style> is even parsed —
    // claims the correct canvas for the very first frame.
    root.style.colorScheme = t;
    var m=document.querySelector('meta[name="theme-color"]');
    if(m) m.setAttribute('content', t==='light' ? '#FBFBFB' : '#000000');
    if(animate){
      // Scoped to the toggle only — never on load, never on unrelated repaints.
      // clearTimeout makes a rapid double-toggle collapse into one window
      // instead of stranding the class.
      root.classList.add('theme-transitioning');
      clearTimeout(tid);
      tid=setTimeout(function(){ root.classList.remove('theme-transitioning'); }, 220);
    }
    try{ window.dispatchEvent(new CustomEvent('themechange',{detail:{theme:t}})); }catch(e){}
  }

  window.__setTheme=function(t){ try{ localStorage.setItem(KEY,t); }catch(e){} apply(t,true); };
  window.__getTheme=function(){ return root.getAttribute('data-theme')||'dark'; };

  apply(resolve(), false);

  // Track the OS only until the user makes an explicit choice; after that
  // localStorage wins forever.
  try{
    matchMedia('(prefers-color-scheme: light)').addEventListener('change', function(e){
      if(!stored()) apply(e.matches?'light':'dark', true);
    });
  }catch(e){}
})();
</script>
<style>
  @font-face{font-family:"Suisse Int'l Mono";src:url("assets/suisse int'l/SuisseIntlMonoTrial-Thin.otf") format("opentype");font-weight:200;font-style:normal;font-display:swap}
  @font-face{font-family:"Suisse Int'l Mono";src:url("assets/suisse int'l/SuisseIntlMonoTrial-Regular.otf") format("opentype");font-weight:400;font-style:normal;font-display:swap}
  @font-face{font-family:"Suisse Int'l Mono";src:url("assets/suisse int'l/SuisseIntlMonoTrial-Bold.otf") format("opentype");font-weight:700;font-style:normal;font-display:swap}
  @font-face{font-family:"Suisse Int'l";src:url("assets/suisse int'l/SuisseIntlTrial-Medium.otf") format("opentype");font-weight:500;font-style:normal;font-display:swap}
  @font-face{font-family:"Suisse Int'l";src:url("assets/suisse int'l/SuisseIntlTrial-Regular.otf") format("opentype");font-weight:400;font-style:normal;font-display:swap}


  :root{
    color-scheme:dark;

    --bg:#000;
    --bg-1:rgba(255,255,255,.03);
    --bg-2:rgba(255,255,255,.05);
    --bg-raise:#0a0a0a;
    --line:rgba(255,255,255,.10);
    --line-2:rgba(255,255,255,.14);
    --line-3:rgba(255,255,255,.30);
    --fg:#fff;
    --fg-2:rgba(255,255,255,.54);
    --fg-3:rgba(255,255,255,.54);
    --fg-4:rgba(255,255,255,.40);
    --fg-5:rgba(255,255,255,.18);

    --glass:rgba(0,0,0,.72);
    --fill-btn:rgba(255,255,255,.02);
    --fill-hover:rgba(255,255,255,.06);
    --fill-hover-2:rgba(255,255,255,.08);
    --ring-hover:rgba(255,255,255,.30);
    --ring-inset:transparent;
    --focus:rgba(255,255,255,.75);

    --accent-live:#39FF13;
    --accent-live-glow:rgba(57,255,19,.45);
    --accent-live-ring:rgba(57,255,19,.35);

    --shadow-nav:0 1px 0 rgba(255,255,255,.04) inset, 0 8px 30px rgba(0,0,0,.5);
    --shadow-solid:0 4px 24px rgba(255,255,255,.15);
    --shadow-toast:0 20px 50px rgba(0,0,0,.4);
    --shadow-modal:0 40px 100px rgba(0,0,0,.6);
    --glow-dot:0 0 8px rgba(255,255,255,.5);
    --halo:0 4px 32px rgba(0,0,0,.85);
    --halo-2:0 2px 16px rgba(0,0,0,.85);

    --scrim:rgba(0,0,0,.8);
    --on-scrim:rgba(255,255,255,.28);
    --on-scrim-2:rgba(255,255,255,.36);
    --on-scrim-line:rgba(255,255,255,.22);

    --media-chip:rgba(0,0,0,.55);
    --media-chip-line:rgba(255,255,255,.14);
    --media-chip-fg:rgba(255,255,255,.54);

    --grain-opacity:.06;
    --grain-blend:overlay;
    --grain-filter:url(#grain-dark);

    --thumb-a:#0e0e0e;
    --thumb-b:#050505;
    --thumb-stripe:rgba(255,255,255,.04);
    --thumb-glyph:rgba(255,255,255,.06);
    --thumb-grad-1:#1c1c1c;
    --thumb-grad-2:#050505;
    --thumb-grad-3:#141414;
    --thumb-grad-glyph:rgba(255,255,255,.62);
    --thumb-grad-blend:overlay;

    --sig-fg:#ffffff;

    --smoothing:antialiased;
    --smoothing-moz:grayscale;

    --mono:"Suisse Int'l Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:"Inter",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    --display:"Inter Tight",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    --col: 720px;
  }

  /* ── LIGHT ──────────────────────────────────────────────────────────────
     Pure token overrides. Every grey is matched to the PERCEPTUAL weight of
     its dark counterpart, not its alpha — black-on-white reads heavier than
     white-on-black at identical alpha. Keep this block in sync with the
     @media print copy at the end of the sheet.  */
  :root[data-theme="light"]{
    color-scheme:light;

    /* Opaque, not black-alpha: alpha over a photo darkens it, and card fills
       must stay stable regardless of what sits behind them. */
    --bg:#FBFBFB;
    --bg-1:#F5F5F5;
    --bg-2:#F0F0F0;
    --bg-raise:#F0F0F0;
    --line:#E4E4E4;
    --line-2:#D8D8D8;
    --line-3:#BDBDBD;
    --fg:#111111;
    --fg-2:#666666;
    --fg-3:#666666;
    --fg-4:#8A8A8A;
    --fg-5:#CCCCCC;

    /* Translucent by necessity (Rule 4) — alpha = dark alpha x 0.7 */
    --glass:rgba(255,255,255,.72);
    --fill-btn:rgba(0,0,0,.014);
    --fill-hover:rgba(0,0,0,.042);
    --fill-hover-2:rgba(0,0,0,.056);
    --ring-hover:rgba(0,0,0,.21);
    --ring-inset:var(--line);
    --focus:#111111;

    /* Green re-derived for a near-white ground: #39FF13 measures 1.31:1 here. */
    --accent-live:#0A8F3C;
    --accent-live-glow:rgba(10,143,60,.26);
    --accent-live-ring:rgba(10,143,60,.32);

    /* Rule 5 — elevation is a hairline plus at most a 1px hint, never a drop. */
    --shadow-nav:0 1px 0 rgba(255,255,255,.9) inset, 0 1px 2px rgba(0,0,0,.04), 0 6px 20px rgba(0,0,0,.05);
    --shadow-solid:0 4px 24px rgba(0,0,0,.10);
    --shadow-toast:0 12px 32px rgba(0,0,0,.14);
    --shadow-modal:0 24px 64px rgba(0,0,0,.22);
    --glow-dot:none;
    --halo:0 4px 32px rgba(251,251,251,.9);
    --halo-2:0 2px 16px rgba(251,251,251,.9);

    /* Scrim-relative: these sit on --scrim in BOTH themes, so they stay light. */
    --scrim:rgba(0,0,0,.55);

    --media-chip:rgba(255,255,255,.62);
    --media-chip-line:rgba(0,0,0,.10);
    --media-chip-fg:rgba(0,0,0,.62);

    /* Grain inverts: darker specks, multiply, and roughly half the opacity —
       texture reads far louder on a light ground. Desaturated in light because
       feTurbulence emits colour noise and the ramp must stay neutral. */
    --grain-opacity:.03;
    --grain-blend:multiply;
    --grain-filter:url(#grain-light);

    --thumb-a:#F2F2F2;
    --thumb-b:#FAFAFA;
    --thumb-stripe:rgba(0,0,0,.035);
    --thumb-glyph:rgba(0,0,0,.05);
    --thumb-grad-1:#E8E8E8;
    --thumb-grad-2:#FAFAFA;
    --thumb-grad-3:#EFEFEF;
    --thumb-grad-glyph:rgba(0,0,0,.34);
    --thumb-grad-blend:multiply;

    --sig-fg:#333333;

    /* Deliberate: antialiased thins dark-on-light type into anaemia. */
    --smoothing:auto;
    --smoothing-moz:auto;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);font-family:var(--sans);
    -webkit-font-smoothing:var(--smoothing);-moz-osx-font-smoothing:var(--smoothing-moz);text-rendering:optimizeLegibility;
    font-feature-settings:"ss01","cv11"}
  body{min-height:100vh}
  #root{overflow-x:hidden;width:100%}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;color:inherit}
  ::selection{background:var(--fg);color:var(--bg)}

  /* Grain overlay */
  .grain{position:fixed;inset:0;pointer-events:none;z-index:1000;opacity:var(--grain-opacity);mix-blend-mode:var(--grain-blend)}
  .grain svg{width:100%;height:100%}
  .grain rect{filter:var(--grain-filter)}

  /* Blend-mode circle cursor.
     The #fff below is deliberate and must NOT be tokenised: it is the operand
     of the wrapper's mix-blend-mode:difference, so it inverts against whatever
     is under it and is already correct in both themes. Binding it to --fg
     would make the dot invisible in light. The two states that switch the
     wrapper to mix-blend-mode:normal (.on-tg, .lens) DO use tokens. */
  .cursor{width:20px;height:20px;border-radius:999px;
    background:#fff;
    transform:translate(-50%,-50%);transition:width .25s cubic-bezier(.2,.8,.2,1),
      height .25s cubic-bezier(.2,.8,.2,1), opacity .2s ease, background .2s ease;
    will-change:width,height;opacity:0}
  .cursor.ready{opacity:1}
  .cursor.ready.hide{opacity:0}
  .cursor.hover{width:48px;height:48px}
  .cursor.press{width:14px;height:14px}
  /* On Telegram-blue surfaces, drop blend-mode (avoids dirty-orange invert) — JS toggles parent mix-blend-mode */
  .cursor.on-tg{background:transparent;
    border:1.5px solid var(--fg);box-shadow:none}
  .cursor.lens{width:100px;height:50px;border-radius:9999px;background:transparent;
    border:0.5px solid var(--line-2);overflow:hidden}
  #cursor-lens-img{position:absolute;display:none;pointer-events:none;top:0;left:0}
  .cursor.lens #cursor-lens-img{display:block}
  @media (hover:none){.cursor{display:none}}
  html.has-custom-cursor,
  html.has-custom-cursor *{cursor:none !important}

  .wrap{max-width:var(--col);margin:0 auto;padding:0 24px;position:relative;z-index:2}
  .wrap-wide{max-width:1080px;margin:0 auto;padding:0 24px;position:relative;z-index:2}

  /* hairline */
  .hr{height:1px;background:var(--line);width:100%}

  /* Typography */
  .display{font-family:var(--display);font-weight:300;letter-spacing:-0.025em;line-height:1.02}
  .mono{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-4)}
  .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-5)}

  /* NAV */
  .nav-wrap{position:fixed;top:18px;left:0;right:0;z-index:100;display:flex;justify-content:center;pointer-events:none}
  .nav{pointer-events:auto;display:flex;align-items:center;gap:2px;padding:6px;
    background:var(--glass);border:.5px solid var(--line-2);border-radius:999px;
    -webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);
    box-shadow:var(--shadow-nav);
    transition:transform .6s cubic-bezier(.4,0,.2,1), padding .6s cubic-bezier(.4,0,.2,1), background .6s cubic-bezier(.4,0,.2,1)}
  .nav.condensed{padding:4px;transform:scale(.94)}
  .nav a.nav-link{position:relative;display:inline-flex;align-items:center;justify-content:center;
    width:80px;padding:12.5px 0 11.5px;border-radius:999px;font-size:12.5px;line-height:1;color:var(--fg-4);
    letter-spacing:-.005em;
    transition:color .6s cubic-bezier(.4,0,.2,1), background .6s cubic-bezier(.4,0,.2,1)}
  .nav a.nav-link:hover{color:var(--fg)}
  .nav a.nav-link.active{color:var(--fg);background:var(--fill-hover);font-weight:500}


  /* Buttons */
  .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;
    border:.5px solid var(--line-2);border-radius:999px;font-size:13px;color:var(--fg);
    background:var(--fill-btn);cursor:default;pointer-events:auto;
    transition:background-color .3s ease-out,color .3s ease-out,border-color .3s ease-out,transform .3s ease-out,box-shadow .3s ease-out;
    position:relative;letter-spacing:-.005em;z-index:10}
  .btn:hover{background:var(--fg);color:var(--bg);border-color:var(--fg)}
  .btn .arrow{display:inline-flex;align-items:center;opacity:.7;transition:opacity .3s ease-out}
  .btn:hover .arrow{opacity:1}
  /* Diagonal arrow swap */
  .diag-arrow{position:relative;display:inline-flex;overflow:hidden}
  .diag-arrow .da-out,.diag-arrow .da-in{display:inline-flex;transition:transform .3s ease-out,opacity .3s ease-out}
  .diag-arrow .da-in{position:absolute;inset:0;transform:translate(-110%,110%);opacity:0}
  a:hover .diag-arrow .da-out,button:hover .diag-arrow .da-out{transform:translate(110%,-110%);opacity:0}
  a:hover .diag-arrow .da-in,button:hover .diag-arrow .da-in{transform:translate(0,0);opacity:1}
  .btn-ghost{background:transparent}
  .btn-sm{padding:8px 13px;font-size:12px}
  /* Solid white variant — spatial lift on hover */
  .btn-solid{background:var(--fg);color:var(--bg);border-color:var(--fg)}
  .btn-solid:hover{background:var(--fg);color:var(--bg);border-color:var(--fg);transform:scale(1.02);box-shadow:var(--shadow-solid)}
  /* Telegram variant — ghost (Header) */
  .btn-tg{background:transparent;border:.5px solid var(--line-2)}
  .btn-tg:hover{background:var(--fill-hover-2);color:var(--fg);border-color:var(--line-3);transform:scale(1.02)}
  .btn-tg:hover .arrow{color:var(--fg)}
  /* Telegram variant — solid black (Footer) */
  .btn-tg-footer{background:var(--bg);color:var(--fg);border:.5px solid var(--line-2)}
  .btn-tg-footer:hover{background:var(--bg-raise);color:var(--fg);border-color:var(--line-3);transform:scale(1.02)}
  .btn-tg-footer:hover .arrow{color:var(--fg)}
  .btn-tg:hover .arrow{color:var(--fg)}

  /* Design Pill */
  .design-pill{display:inline-flex;align-items:center;justify-content:center;
    padding:4px 6px;border-radius:999px;background:transparent;
    border:.5px solid var(--line-2);
    font-family:"Suisse Int'l",var(--sans);font-weight:400;font-size:10px;
    letter-spacing:.08em;text-transform:uppercase;color:var(--fg-4);
    line-height:1;margin-right:10px}

  /* Hero */
  .hero{padding:120px 0 104px;position:relative}
  .hero-top{display:flex;flex-direction:column;align-items:flex-start;gap:22px;margin-bottom:32px}
  .hero[data-layout="centered"] .hero-top{align-items:center}
  .avatar{width:40px;height:40px;border-radius:999px;overflow:hidden;
    background:var(--bg-2);border:0;
    position:relative;flex:0 0 40px;}
  .avatar.lg{width:88px;height:88px;flex:0 0 88px}
  .avatar .mono-badge{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);
    font-weight:500;font-size:14px;color:var(--fg-2);letter-spacing:-.02em}
  .status{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10.5px;
    letter-spacing:.12em;text-transform:uppercase;color:var(--fg-4)}
  .status .pulse{width:6px;height:6px;border-radius:999px;background:var(--accent-live);position:relative;
    box-shadow:0 0 8px var(--accent-live-glow)}
  .status .pulse::after{content:"";position:absolute;inset:-4px;border-radius:999px;
    border:1px solid var(--accent-live-ring);animation:pulse 2.4s ease-out infinite}
  @keyframes pulse{0%{transform:scale(.7);opacity:.7}100%{transform:scale(1.6);opacity:0}}

  h1.hero-title{font-family:var(--display);font-weight:400;letter-spacing:-.03em;
    font-size:clamp(40px,6.2vw,72px);line-height:1.02;margin:0 0 28px;overflow-wrap:break-word}
  h1.hero-title em{font-style:normal;color:inherit;font-weight:400}

  .thesis{font-family:var(--display);font-weight:300;color:var(--fg-2);
    font-size:clamp(17px,1.4vw,19px);line-height:1.55;letter-spacing:-.01em;max-width:640px;margin:0 0 32px;
    text-wrap:pretty}

  .cta-row{display:flex;gap:10px;flex-wrap:wrap}

  /* Marquee */
  .marquee-sec{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:22px 0;
    position:relative;overflow:hidden;margin-top:40px;
    -webkit-mask-image:linear-gradient(to right, transparent 15%, black 50%, black 50%, transparent 85%);
            mask-image:linear-gradient(to right, transparent 15%, black 50%, black 50%, transparent 85%)}
  .marquee-inner{display:flex;gap:48px;animation:marq 80s linear infinite;width:max-content}
  .marquee-inner .chip{font-family:var(--display);font-weight:450;font-size:clamp(16px,1.4vw,20px);
    color:var(--fg-4);letter-spacing:-.015em;white-space:nowrap;display:inline-flex;align-items:center;gap:48px;
    text-transform:none}
  .marquee-inner .chip .sep{display:inline-flex;align-items:center;justify-content:center;
    color:var(--fg-5);font-family:var(--display);font-weight:300;font-size:.95em;
    line-height:1;letter-spacing:0;width:auto;height:auto;background:transparent;border-radius:0;
    transform:translateY(-1px)}
  /* separator glyph variants */
  .marquee-inner[data-sep="slash"] .chip .sep::before{content:"/"}
  .marquee-inner[data-sep="dash"]  .chip .sep::before{content:"—"}
  .marquee-inner[data-sep="plus"]  .chip .sep::before{content:"+"}
  .marquee-inner[data-sep="asterisk"] .chip .sep::before{content:"*";transform:translateY(2px);display:inline-block}
  .marquee-inner[data-sep="dot"]   .chip .sep{width:5px;height:5px;border-radius:999px;
    background:var(--fg-5);transform:none}
  .marquee-inner[data-sep="dot"]   .chip .sep::before{content:""}
  @keyframes marq{to{transform:translateX(-50%)}}

  .utility-row{display:flex;justify-content:space-between;align-items:center;
    padding:14px 0;font-family:var(--mono);font-size:11px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--fg-4)}
  .utility-row .dots{display:inline-flex;gap:6px;align-items:center}
  .utility-row .live-dot{width:6px;height:6px;border-radius:999px;background:var(--fg);box-shadow:var(--glow-dot);
    animation:blink 1.6s ease-in-out infinite}
  @keyframes blink{50%{opacity:.3}}

  /* Section scaffolding */
  section.block{padding:104px 0;position:relative}
  section.block#portfolio{margin-top:72px}
  .section-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:36px;gap:24px}
  .section-head h2{font-family:var(--display);font-weight:300;font-size:clamp(28px,3.2vw,40px);
    letter-spacing:-.03em;margin:0;line-height:1}
  .section-head .meta{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--fg-5)}

  /* Projects */
  .project-grid{display:grid;grid-template-columns:1fr 1fr;gap:51px 28px}
  .project-grid[data-density="loose"]{gap:77px 28px}
  .project-grid[data-density="tight"]{gap:27px 18px}
  .card.card-wide{grid-column:1 / -1}
  .card.card-wide .thumb{aspect-ratio:40/21}

  .card{position:relative;display:flex;flex-direction:column;gap:14px;cursor:default}
  .card .thumb{position:relative;aspect-ratio:4/3;border-radius:14px;overflow:hidden;
    background:var(--bg-2);border:.5px solid var(--line);isolation:isolate;
    box-shadow:0 0 0 0 transparent;transition:box-shadow .6s cubic-bezier(.4,0,.2,1)}
  .card:hover .thumb{box-shadow:0 0 0 2px var(--fg)}
  /* Thumbnails with no light-mode variant keep the dark asset; this ring
     tethers them to the page instead of letting them float. Token-driven,
     so it is simply transparent in dark rather than a theme conditional. */
  .card .thumb.thumb-ring::before{content:"";position:absolute;inset:0;border-radius:inherit;
    box-shadow:inset 0 0 0 1px var(--ring-inset);z-index:4;pointer-events:none}
  /* Inert: opacity:0 and nothing sets it to 1. Left as-is (out of scope).
     Both this scrim and .thumb-label below sit over the image, not over --bg,
     so their black/white values would stay correct if ever re-enabled. */
  .card .thumb::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,transparent 55%, rgba(0,0,0,.55));opacity:0;z-index:2}
  .card .thumb-inner{position:absolute;inset:0;will-change:transform}
  .card .thumb-label{position:absolute;left:16px;bottom:14px;z-index:3;
    font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
    color:#fff;opacity:0;transform:translateY(6px)}
  .card .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .card .t{font-family:var(--display);font-weight:400;font-size:19px;letter-spacing:0;color:var(--fg)}
  .card .d{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-4)}
  .card .sub{font-size:13px;color:var(--fg-3);line-height:1.5;margin:0}
  .card .card-sub-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .card .ext{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:999px;
    background:var(--media-chip);border:.5px solid var(--media-chip-line);display:grid;place-items:center;
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:var(--media-chip-fg);z-index:3;
    opacity:0;transform:translate(-3px,3px);
    transition:opacity .6s cubic-bezier(.4,0,.2,1),transform .6s cubic-bezier(.4,0,.2,1)}
  .card:hover .ext{opacity:1;transform:translate(0,0)}

  /* Thumb variants */
  .thumb-stripes{background:
    repeating-linear-gradient(135deg, var(--thumb-stripe) 0 2px, transparent 2px 18px),
    linear-gradient(180deg,var(--thumb-a),var(--thumb-b));height:100%}
  .thumb-stripes .glyph{position:absolute;inset:0;display:grid;place-items:center;
    font-family:var(--display);font-weight:200;font-size:96px;color:var(--thumb-glyph);letter-spacing:-.04em}
  .thumb-grad{position:absolute;inset:0;overflow:hidden}
  .thumb-grad::before{content:"";position:absolute;inset:-40%;background:conic-gradient(from 210deg,var(--thumb-grad-1),var(--thumb-grad-2),var(--thumb-grad-3),var(--thumb-grad-2),var(--thumb-grad-1));
    filter:blur(30px)}
  .thumb-grad .glyph{position:absolute;inset:0;display:grid;place-items:center;z-index:1;
    font-family:var(--display);font-weight:200;font-size:76px;color:var(--thumb-grad-glyph);letter-spacing:-.04em;
    mix-blend-mode:var(--thumb-grad-blend)}
  .thumb-block{position:absolute;inset:0;background:var(--bg);display:grid;place-items:center}
  .thumb-block .glyph{font-family:var(--display);font-weight:200;font-size:72px;color:var(--fg-3);letter-spacing:-.04em}
  .thumb-block::before{content:"";position:absolute;inset:16px;border:.5px solid var(--line);border-radius:6px}

  /* Career list */
  .list{border-top:1px solid var(--line)}
  .list .item{display:grid;grid-template-columns:1.3fr 1.1fr .7fr 100px;gap:16px;align-items:start;
    min-height:88px;padding:18px 0 18px;border-bottom:1px solid var(--line);transition:padding .6s cubic-bezier(.4,0,.2,1), background .6s cubic-bezier(.4,0,.2,1)}
  .list .item:hover{background:linear-gradient(180deg,var(--fill-btn),transparent);padding-left:6px;padding-right:6px}
  .list .item .role{font-family:var(--display);font-size:18px;font-weight:400;letter-spacing:0}
  .list .item .co{color:var(--fg-3);font-size:14px}
  .list .item .when{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-4);padding-top:1px}
  .list .item .type{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-4);text-align:right;padding-top:1px}
  /* Nested sub-list (Path courses) */
  .item-subs{grid-column:2/-1;border-top:1px solid var(--line);
    padding:0 0 0;margin-top:8px;display:flex;flex-direction:column;gap:0}
  .item-sub{display:flex;justify-content:space-between;align-items:center;
    font-size:12px;color:var(--fg-4);line-height:1;
    padding:10px 0;border-bottom:1px solid var(--line);
    opacity:0;transform:translateY(12px)}
  .item-sub:last-child{border-bottom:none}
  .item-sub .sub-name{font-family:var(--sans);font-weight:500;letter-spacing:-.005em}
  .item-sub .sub-idx{font-family:var(--mono);font-size:10px;letter-spacing:.10em;
    margin-left:32px;flex-shrink:0}
  @keyframes subRowIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .item-sub.sub-visible{animation:subRowIn 700ms cubic-bezier(.16,1,.3,1) both}
  @media(prefers-reduced-motion:reduce){.item-sub{opacity:1;transform:none}.item-sub.sub-visible{animation:none}}

  /* Benefits */
  .benefits{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px}
  .benefit{background:var(--bg);padding:28px 26px;display:flex;flex-direction:column;gap:10px;min-height:170px;
    transition:box-shadow .5s ease-out,transform .5s ease-out;position:relative;
    opacity:0;transform:translateY(15px)}
  .benefit:nth-child(1){border-top-left-radius:13px}
  .benefit:nth-child(2){border-top-right-radius:13px}
  .benefit:nth-child(3){border-bottom-left-radius:13px}
  .benefit:nth-child(4){border-bottom-right-radius:13px}
  .benefit.benefit-visible{animation:benefitIn 700ms cubic-bezier(.16,1,.3,1) both}
  .benefit:hover{box-shadow:inset 0 0 0 1px var(--ring-hover);transform:translateY(-2px)}
  .benefit .icon{width:26px;height:26px;display:grid;place-items:center;color:var(--fg-4);margin-bottom:6px;transition:color .5s ease-out}
  .benefit .num{position:absolute;top:22px;right:24px;font-family:var(--mono);font-size:10.5px;color:var(--fg-4);letter-spacing:.14em;transition:color .5s ease-out}
  .benefit:hover .icon,.benefit:hover .num{color:var(--fg)}
  @keyframes benefitIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){.benefit{opacity:1;transform:none}.benefit.benefit-visible{animation:none}}
  .benefit h3{font-family:var(--display);font-weight:400;font-size:20px;letter-spacing:0;margin:0}
  .benefit p{margin:0;color:var(--fg-3);font-size:13.5px;line-height:1.55;text-wrap:pretty}

  /* Footer */
  footer{padding-top:104px;padding-bottom:0;position:relative;overflow:visible}
  .footer-top{position:relative;text-align:center;padding-bottom:96px}
  .footer-top h2{font-family:var(--display);font-weight:300;font-size:clamp(44px,6vw,72px);
    letter-spacing:-.035em;line-height:1;margin:0 0 22px;
    text-shadow:var(--halo)}
  .footer-top p{color:var(--fg-3);max-width:440px;margin:0 auto 28px;font-size:15px;line-height:1.6;
    text-shadow:var(--halo-2)}

  /* Ironclad canvas wrapper — fixed height, behind CTA, full viewport width */
  .footer-cta-zone{position:relative;isolation:isolate;display:flex;gap:10px;
    justify-content:center;flex-wrap:wrap}
  /* Center the wrapper halfway between the CTA buttons and the profile block.
     Anchor: parent's vertical mid (button row) shifted down by ~half the
     gap (footer-top padding-bottom 96px + ident padding-top 80px ≈ 176px,
     so half = ~110px below button center). */
  .cta-canvas-wrap{position:absolute;left:50%;top:50%;
    transform:translate(-50%, calc(-50% + 110px));
    width:100vw;height:380px;z-index:-1;pointer-events:none;overflow:hidden}
  .footer-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}

  .ident{display:flex;align-items:center;gap:12px;padding:80px 0 40px}
  .ident .meta{display:flex;flex-direction:column;gap:2px}
  .ident .meta .n{font-family:var(--display);font-size:15px;letter-spacing:-.01em}
  .ident .meta .r{font-size:12.5px;color:var(--fg-3)}

  .foot-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;padding:24px 0 64px;border-top:1px solid var(--line)}
  .foot-cols .col{display:flex;flex-direction:column;align-items:stretch}
  .foot-cols .col .h{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-4);margin-bottom:14px}
  .foot-cols .col a{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:7px 12px;margin:0 -12px;color:var(--fg-2);font-size:13.5px;border-radius:999px;
    transition:color .3s ease-out, box-shadow .3s ease-out}
  .foot-cols .col a:hover{box-shadow:inset 0 0 0 0.5px var(--line-2);color:var(--fg)}
  .foot-cols .col a span{font-size:10px;line-height:1;display:inline-flex;align-items:center}
  .foot-cols .col a .ic{display:inline-flex;color:var(--fg-4);opacity:.4;
    transition:color .3s ease-out, opacity .3s ease-out, transform .3s ease-out}
  .foot-cols .col a:hover .ic{color:var(--fg);opacity:1}

  .signature{padding:40px 0 24px;position:relative;z-index:2;width:100%;
    display:flex;flex-direction:column;align-items:center;overflow:hidden}
  @keyframes sigMarquee{to{transform:translateX(-50%)}}
  .sig-marquee{width:100%;overflow:hidden}
  .sig-track{display:flex;width:max-content;will-change:transform;
    animation:sigMarquee 32s linear infinite}
  .sig-item{white-space:nowrap;font-family:var(--display);font-weight:200;
    letter-spacing:-.045em;text-transform:uppercase;font-size:clamp(18px,5.5vw,130px);
    line-height:.9;color:var(--sig-fg);padding-right:clamp(40px,4vw,100px)}
  @media(prefers-reduced-motion:reduce){.sig-track{animation-play-state:paused}}
  .signature .sub{margin-top:14px;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-4);display:flex;align-items:center;padding:0 20px;width:100%}
  .signature .sub span{flex:1}
  .signature .sub span:nth-child(2){text-align:center}
  .signature .sub span:last-child{text-align:right}

  /* Toast */
  .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);z-index:2000;
    background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:12.5px;
    font-family:var(--sans);letter-spacing:-.005em;opacity:0;transition:transform .6s cubic-bezier(.4,0,.2,1), opacity .6s cubic-bezier(.4,0,.2,1);
    box-shadow:var(--shadow-toast);display:flex;align-items:center;gap:8px}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}

  /* Scroll reveal */
  @keyframes revealIn{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
  .reveal{opacity:0;transform:translateY(40px);will-change:opacity,transform}
  .reveal.visible{animation:revealIn 1.2s cubic-bezier(.16,1,.3,1) forwards}
  @media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none}.reveal.visible{animation:none}}

  @media (max-width: 720px){
    .project-grid{grid-template-columns:1fr}
    .benefits{grid-template-columns:1fr}
    .foot-cols{grid-template-columns:1fr 1fr}
    .list .item{grid-template-columns:1fr 1fr;gap:6px 16px}
    .list .item .type{display:none}
    .nav a.nav-link{width:auto;padding:8.5px 11px 7.5px;font-size:12px}
    .card.card-wide{grid-column:auto}
    .card.card-wide .thumb{aspect-ratio:4/3}
    h1.hero-title{font-size:clamp(28px,9vw,44px)}
    .footer-top h2{font-size:clamp(30px,9.5vw,50px)}
    .section-head h2{font-size:clamp(22px,6vw,32px)}
  }

  /* Hero layout variants */
  .hero[data-layout="centered"]{text-align:center}
  .hero[data-layout="centered"] .hero-top{justify-content:center}
  .hero[data-layout="centered"] .thesis{margin-left:auto;margin-right:auto}
  .hero[data-layout="centered"] .cta-row{justify-content:center}

  .hero[data-layout="split"] .hero-grid{display:grid;grid-template-columns:auto 1fr;gap:36px;align-items:start}
  .hero[data-layout="split"] .avatar{width:92px;height:92px;flex:0 0 92px;border-radius:14px}
  .hero[data-layout="split"] .avatar .mono-badge{font-size:32px}
  .hero[data-layout="split"] .hero-top{margin-bottom:12px;gap:0}
  .hero[data-layout="split"] h1.hero-title{margin-top:-6px}

  /* Resume preview modal */
  .resume-modal-backdrop{position:fixed;inset:0;z-index:9000;display:flex;align-items:center;justify-content:center;
    background:var(--scrim);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    animation:modalIn .25s cubic-bezier(.4,0,.2,1)}
  @keyframes modalIn{from{opacity:0}to{opacity:1}}
  .resume-modal-inner{display:flex;flex-direction:column;align-items:center;gap:16px}
  .resume-modal-frame{height:85vh;aspect-ratio:210/297;border-radius:16px;overflow:hidden;
    box-shadow:var(--shadow-modal);flex-shrink:0}
  .resume-modal-frame iframe{width:100%;height:100%;border:none;display:block}
  .resume-modal-hint{font-size:11.5px;font-family:var(--sans);letter-spacing:.01em;
    color:var(--on-scrim);display:flex;align-items:center;gap:6px;flex-shrink:0}
  .resume-kbd{display:inline-flex;align-items:center;justify-content:center;
    padding:3px 7px 3px;border-radius:6px;font-size:10.5px;font-weight:700;font-family:var(--mono);
    color:var(--on-scrim-2);box-shadow:inset 0 0 0 0.5px var(--on-scrim-line);
    background:transparent;letter-spacing:.06em;line-height:1}

  /* ── Theme toggle (nav) ───────────────────────────────────────────────
     Icon-only and fixed-width on purpose: a mono "LIGHT"/"DARK" label would
     re-measure the pill on every toggle and cost layout shift. */
  .nav-sep{flex:0 0 1px;width:1px;height:16px;background:var(--line-2);margin:0 5px}
  .nav .nav-theme{appearance:none;-webkit-appearance:none;border:0;padding:0;margin:0;
    flex:0 0 34px;width:34px;height:34px;border-radius:999px;background:transparent;
    color:var(--fg-4);display:inline-flex;align-items:center;justify-content:center;
    cursor:default;pointer-events:auto;
    transition:color .6s cubic-bezier(.4,0,.2,1), background .6s cubic-bezier(.4,0,.2,1)}
  .nav .nav-theme:hover{color:var(--fg);background:var(--fill-hover)}
  .nav .nav-theme svg{display:block}

  /* ── Focus ────────────────────────────────────────────────────────────
     :focus-visible only, so this is keyboard-exclusive and never fires on
     a mouse click. The site previously had no focus affordance at all. */
  a:focus-visible,button:focus-visible,[role="button"]:focus-visible{
    outline:2px solid var(--focus);outline-offset:3px;border-radius:999px}
  .card .thumb:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:14px}

  /* ── Theme transition ─────────────────────────────────────────────────
     Only ever active during the ~220ms window the toggle opens. Never on
     first load, never on unrelated repaints. Colour properties only. */
  html.theme-transitioning,
  html.theme-transitioning *,
  html.theme-transitioning *::before,
  html.theme-transitioning *::after{
    transition:background-color 180ms ease, color 180ms ease,
               border-color 180ms ease, fill 180ms ease !important}
  @media(prefers-reduced-motion:reduce){
    html.theme-transitioning,
    html.theme-transitioning *,
    html.theme-transitioning *::before,
    html.theme-transitioning *::after{transition:none !important}
  }

  /* ── Print ────────────────────────────────────────────────────────────
     Forced light regardless of the active theme. Mirror of the
     :root[data-theme="light"] block above — keep the two in sync. */
  @media print{
    :root{
    color-scheme:light;

    /* Opaque, not black-alpha: alpha over a photo darkens it, and card fills
       must stay stable regardless of what sits behind them. */
    --bg:#FBFBFB;
    --bg-1:#F5F5F5;
    --bg-2:#F0F0F0;
    --bg-raise:#F0F0F0;
    --line:#E4E4E4;
    --line-2:#D8D8D8;
    --line-3:#BDBDBD;
    --fg:#111111;
    --fg-2:#666666;
    --fg-3:#666666;
    --fg-4:#8A8A8A;
    --fg-5:#CCCCCC;

    /* Translucent by necessity (Rule 4) — alpha = dark alpha x 0.7 */
    --glass:rgba(255,255,255,.72);
    --fill-btn:rgba(0,0,0,.014);
    --fill-hover:rgba(0,0,0,.042);
    --fill-hover-2:rgba(0,0,0,.056);
    --ring-hover:rgba(0,0,0,.21);
    --ring-inset:var(--line);
    --focus:#111111;

    /* Green re-derived for a near-white ground: #39FF13 measures 1.31:1 here. */
    --accent-live:#0A8F3C;
    --accent-live-glow:rgba(10,143,60,.26);
    --accent-live-ring:rgba(10,143,60,.32);

    /* Rule 5 — elevation is a hairline plus at most a 1px hint, never a drop. */
    --shadow-nav:0 1px 0 rgba(255,255,255,.9) inset, 0 1px 2px rgba(0,0,0,.04), 0 6px 20px rgba(0,0,0,.05);
    --shadow-solid:0 4px 24px rgba(0,0,0,.10);
    --shadow-toast:0 12px 32px rgba(0,0,0,.14);
    --shadow-modal:0 24px 64px rgba(0,0,0,.22);
    --glow-dot:none;
    --halo:0 4px 32px rgba(251,251,251,.9);
    --halo-2:0 2px 16px rgba(251,251,251,.9);

    /* Scrim-relative: these sit on --scrim in BOTH themes, so they stay light. */
    --scrim:rgba(0,0,0,.55);

    --media-chip:rgba(255,255,255,.62);
    --media-chip-line:rgba(0,0,0,.10);
    --media-chip-fg:rgba(0,0,0,.62);

    /* Grain inverts: darker specks, multiply, and roughly half the opacity —
       texture reads far louder on a light ground. Desaturated in light because
       feTurbulence emits colour noise and the ramp must stay neutral. */
    --grain-opacity:.03;
    --grain-blend:multiply;
    --grain-filter:url(#grain-light);

    --thumb-a:#F2F2F2;
    --thumb-b:#FAFAFA;
    --thumb-stripe:rgba(0,0,0,.035);
    --thumb-glyph:rgba(0,0,0,.05);
    --thumb-grad-1:#E8E8E8;
    --thumb-grad-2:#FAFAFA;
    --thumb-grad-3:#EFEFEF;
    --thumb-grad-glyph:rgba(0,0,0,.34);
    --thumb-grad-blend:multiply;

    --sig-fg:#333333;

    /* Deliberate: antialiased thins dark-on-light type into anaemia. */
    --smoothing:auto;
    --smoothing-moz:auto;
    }
    .grain,.cursor,.nav-wrap,.cta-canvas-wrap,.toast,.twk-panel{display:none !important}
    html,body{background:#FFFFFF}
  }
</style>
</head>
<body>

  <div class="grain" aria-hidden="true">
    <svg xmlns="http://www.w3.org/2000/svg">
      <filter id="grain-dark"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/></filter>
      <filter id="grain-light"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
      <rect width="100%" height="100%"/>
    </svg>
  </div>

  <div id="root"></div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/framer-motion@10.16.4/dist/framer-motion.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="sections.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
